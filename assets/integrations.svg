<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Finhashy AI connected to bureau, KYC, documents, core banking and notifications">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35a37a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2e7d64" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <!-- links -->
  <g stroke="#bfe0d3" stroke-width="2" fill="none">
    <path d="M260 210 C160 120 140 110 90 80"/>
    <path d="M260 210 C160 200 130 210 70 210"/>
    <path d="M260 210 C160 300 140 320 90 350"/>
    <path d="M260 210 C360 120 380 110 430 80"/>
    <path d="M260 210 C360 200 400 210 450 210"/>
    <path d="M260 210 C360 300 380 320 430 350"/>
  </g>
  <!-- outer nodes -->
  <g font-family="'Plus Jakarta Sans',Inter,Arial" font-size="12" text-anchor="middle">
    <g><circle cx="80" cy="76" r="34" fill="#fff" stroke="#e4e9e6" stroke-width="2"/><text x="80" y="80" fill="#3a4a42" font-weight="600">Bureau</text></g>
    <g><circle cx="58" cy="210" r="34" fill="#fff" stroke="#e4e9e6" stroke-width="2"/><text x="58" y="214" fill="#3a4a42" font-weight="600">KYC</text></g>
    <g><circle cx="80" cy="346" r="34" fill="#fff" stroke="#e4e9e6" stroke-width="2"/><text x="80" y="342" fill="#3a4a42" font-weight="600">Bank</text><text x="80" y="356" fill="#3a4a42" font-weight="600">stmt</text></g>
    <g><circle cx="440" cy="76" r="34" fill="#fff" stroke="#e4e9e6" stroke-width="2"/><text x="440" y="72" fill="#3a4a42" font-weight="600">Docs</text><text x="440" y="86" fill="#3a4a42" font-weight="600">OCR</text></g>
    <g><circle cx="462" cy="210" r="34" fill="#fff" stroke="#e4e9e6" stroke-width="2"/><text x="462" y="206" fill="#3a4a42" font-weight="600">Core</text><text x="462" y="220" fill="#3a4a42" font-weight="600">banking</text></g>
    <g><circle cx="440" cy="346" r="34" fill="#fff" stroke="#e4e9e6" stroke-width="2"/><text x="440" y="342" fill="#3a4a42" font-weight="600">Notify</text><text x="440" y="356" fill="#3a4a42" font-weight="600">SMS/WA</text></g>
  </g>
  <!-- center -->
  <circle cx="260" cy="210" r="62" fill="url(#glow)"/>
  <circle cx="260" cy="210" r="62" fill="none" stroke="#9cc9b8" stroke-width="2" opacity="0.7"/>
  <text x="260" y="204" font-family="'Plus Jakarta Sans',Inter,Arial" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Finhashy</text>
  <text x="260" y="226" font-family="'Plus Jakarta Sans',Inter,Arial" font-size="16" font-weight="800" fill="#d6ece2" text-anchor="middle">AI</text>
