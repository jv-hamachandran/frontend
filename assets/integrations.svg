<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Loan lifecycle: loan applications, processing, underwriting procedure, disbursal, and customer servicing">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7d64"/>
      <stop offset="0.5" stop-color="#3aa77f"/>
      <stop offset="1" stop-color="#16382d"/>
    </linearGradient>
    <style>
      .lbl { font-family: 'Plus Jakarta Sans', Inter, Arial, sans-serif; font-weight: 700; fill: #24352d; }
      .ic  { fill: none; stroke: #24352d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- connecting ribbon (behind circles) -->
  <polyline points="160,250 350,430 530,250 710,430 860,250"
            fill="none" stroke="url(#ribbon)" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- ===== Step 1: Loan applications (top) ===== -->
  <g>
    <text class="lbl" x="160" y="120" font-size="26" text-anchor="middle">Loan</text>
    <text class="lbl" x="160" y="150" font-size="26" text-anchor="middle">applications</text>
    <circle cx="160" cy="250" r="86" fill="#2e7d64"/>
    <circle cx="160" cy="250" r="60" fill="#fff"/>
    <g class="ic">
      <rect x="140" y="222" width="34" height="46" rx="5"/>
      <line x1="147" y1="236" x2="167" y2="236"/>
      <line x1="147" y1="248" x2="167" y2="248"/>
      <line x1="147" y1="260" x2="160" y2="260"/>
      <circle cx="176" cy="230" r="9"/>
      <line x1="176" y1="226" x2="176" y2="234"/>
    </g>
  </g>

  <!-- ===== Step 2: Processing (bottom) ===== -->
  <g>
    <circle cx="350" cy="430" r="86" fill="#4bb892"/>
    <circle cx="350" cy="430" r="60" fill="#fff"/>
    <g class="ic">
      <circle cx="350" cy="430" r="15"/>
      <line x1="350" y1="406" x2="350" y2="415"/>
      <line x1="350" y1="445" x2="350" y2="454"/>
      <line x1="326" y1="430" x2="335" y2="430"/>
      <line x1="365" y1="430" x2="374" y2="430"/>
      <line x1="333" y1="413" x2="339" y2="419"/>
      <line x1="361" y1="441" x2="367" y2="447"/>
      <line x1="333" y1="447" x2="339" y2="441"/>
      <line x1="361" y1="419" x2="367" y2="413"/>
    </g>
    <text class="lbl" x="350" y="560" font-size="26" text-anchor="middle">Processing</text>
  </g>

  <!-- ===== Step 3: Underwriting procedure (top) ===== -->
  <g>
    <text class="lbl" x="530" y="120" font-size="26" text-anchor="middle">Underwriting</text>
    <text class="lbl" x="530" y="150" font-size="26" text-anchor="middle">procedure</text>
    <circle cx="530" cy="250" r="86" fill="#1c4b3b"/>
    <circle cx="530" cy="250" r="60" fill="#fff"/>
    <g class="ic">
      <path d="M512 268 h30"/>
      <path d="M516 258 L540 234 L550 244 L526 268 Z"/>
      <path d="M540 234 L546 228 L556 238 L550 244"/>
    </g>
  </g>

  <!-- ===== Step 4: Disbursal (bottom) ===== -->
  <g>
    <circle cx="710" cy="430" r="86" fill="#35a37a"/>
    <circle cx="710" cy="430" r="60" fill="#fff"/>
    <g class="ic">
      <rect x="686" y="410" width="34" height="24" rx="3"/>
      <circle cx="703" cy="422" r="6"/>
      <path d="M726 414 h12 M738 414 l-5 -5 M738 414 l-5 5"/>
      <path d="M738 430 h-12 M726 430 l5 -5 M726 430 l5 5"/>
    </g>
    <text class="lbl" x="710" y="560" font-size="26" text-anchor="middle">Disbursal</text>
  </g>

  <!-- ===== Step 5: Customer servicing (top) ===== -->
  <g>
    <text class="lbl" x="860" y="120" font-size="26" text-anchor="middle">Customer</text>
    <text class="lbl" x="860" y="150" font-size="26" text-anchor="middle">servicing</text>
    <circle cx="860" cy="250" r="86" fill="#16382d"/>
    <circle cx="860" cy="250" r="60" fill="#fff"/>
    <g class="ic">
      <circle cx="860" cy="238" r="12"/>
      <path d="M842 274 a18 16 0 0 1 36 0"/>
      <path d="M844 244 v-6 a16 16 0 0 1 32 0 v6"/>
      <path d="M840 244 h6 v12 h-6 z"/>
      <path d="M874 244 h6 v12 h-6 z"/>
    </g>
  </g>
</svg>
