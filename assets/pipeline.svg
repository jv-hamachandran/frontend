<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-label="Loan origination pipeline: RM, CO, BPO, BCM, OPS, Disbursement">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <line x1="90" y1="110" x2="910" y2="110" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Inter,Arial" text-anchor="middle">
    <!-- nodes -->
    <g>
      <circle cx="90" cy="110" r="30" fill="#eef1ff" stroke="#6366f1" stroke-width="3"/>
      <text x="90" y="116" font-size="15" font-weight="700" fill="#4f46e5">RM</text>
      <text x="90" y="170" font-size="13" fill="#64748b">Lead &amp; KYC</text>
    </g>
    <g>
      <circle cx="254" cy="110" r="30" fill="#eef1ff" stroke="#6366f1" stroke-width="3"/>
      <text x="254" y="116" font-size="15" font-weight="700" fill="#4f46e5">CO</text>
      <text x="254" y="170" font-size="13" fill="#64748b">Underwriting</text>
    </g>
    <g>
      <circle cx="418" cy="110" r="30" fill="#e6fbf8" stroke="#14b8a6" stroke-width="3"/>
      <text x="418" y="116" font-size="14" font-weight="700" fill="#0f766e">BPO</text>
      <text x="418" y="170" font-size="13" fill="#64748b">Verification</text>
    </g>
    <g>
      <circle cx="582" cy="110" r="30" fill="#eef1ff" stroke="#6366f1" stroke-width="3"/>
      <text x="582" y="116" font-size="14" font-weight="700" fill="#4f46e5">BCM</text>
      <text x="582" y="170" font-size="13" fill="#64748b">Sanction</text>
    </g>
    <g>
      <circle cx="746" cy="110" r="30" fill="#e6fbf8" stroke="#14b8a6" stroke-width="3"/>
      <text x="746" y="116" font-size="14" font-weight="700" fill="#0f766e">OPS</text>
      <text x="746" y="170" font-size="13" fill="#64748b">Pre-disbursal</text>
    </g>
    <g>
      <circle cx="910" cy="110" r="30" fill="#4f46e5"/>
      <text x="910" y="115" font-size="20" font-weight="700" fill="#fff">₹</text>
      <text x="910" y="170" font-size="13" fill="#64748b">Disbursement</text>
    </g>
  </g>
</svg>
