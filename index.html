  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finhashy AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#030712;
    color:#fff;
}

.nav{
    position:fixed;
    width:100%;
    top:0;
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(3,7,18,.75);
    backdrop-filter:blur(20px);
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#030712,#111827);
}

.hero h1{
    font-size:72px;
    font-weight:800;
}

.grad{
    background:linear-gradient(90deg,#22d3ee,#3b82f6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    border-radius:50px;
    background:linear-gradient(135deg,#2563eb,#22d3ee);
    color:#fff;
    text-decoration:none;
    margin-top:30px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
}
</style>

</head>

<body>

<header class="nav">
    <h2>Finhashy AI</h2>
    <a class="btn" href="#">Book Demo</a>
</header>

<section class="hero">
    <div>
        <h1>Loan Origination System <br><span class="grad">with AI BRE</span></h1>
        <p>AI-powered LOS for NBFCs, Banks & Fintechs </p>
        <a class="btn" href="#">Get Started</a>
    </div>
</section>

</body>
</html></body>
